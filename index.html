<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://* wss://*; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; frame-src 'none';" />
    <link rel="icon" type="image/png" href="/vayna-icon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VAYNA</title>
    <meta name="description" content="VAYNA - Journal de Trading Professionnel" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Exo+2:wght@300;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root">
      <style>
        #initial-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #09090b;
          background-image: radial-gradient(circle at center, rgba(6, 182, 212, 0.08) 0%, rgba(9, 9, 11, 1) 60%);
          overflow: hidden;
          font-family: 'Inter', sans-serif;
        }
        .splash-content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4rem;
          animation: splashIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes splashIn {
          from { transform: scale(0.95) translateY(15px); opacity: 0; }
          to { transform: scale(1) translateY(0); opacity: 1; }
        }
        /* Logo SVG */
        .splash-logo-container {
          transform: scale(0.85);
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        @media (min-width: 640px) {
          .splash-logo-container { transform: scale(1); }
        }
        @media (min-width: 768px) {
          .splash-logo-container { transform: scale(1.25); }
        }
        .splash-logo-text {
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .splash-logo-text-main {
          font-weight: 900;
          letter-spacing: 0.22em;
          line-height: 1;
          position: relative;
          z-index: 10;
          font-size: 46.8px;
          background: linear-gradient(135deg, #ffffff 0%, #93c5fd 40%, #3b82f6 100%);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 12px rgba(59,130,246,0.5));
        }
        .splash-logo-text-sub {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-top: 0.25rem;
        }
        .splash-logo-text-sub span {
          text-transform: uppercase;
          font-weight: 300;
          white-space: nowrap;
          color: rgba(207, 250, 254, 0.5);
          font-size: 15.84px;
          letter-spacing: 0.25em;
        }
        .splash-loading-indicator {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.25rem;
          opacity: 0;
          animation: fadeIn 1s ease-in-out 0.6s forwards;
        }
        @keyframes fadeIn {
          to { opacity: 1; }
        }
        .splash-line {
          width: 16rem;
          height: 2px;
          background-color: rgba(255, 255, 255, 0.1);
          overflow: hidden;
          position: relative;
          border-radius: 9999px;
        }
        .splash-line-inner {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 40%;
          background: linear-gradient(to right, transparent, #22d3ee, transparent);
          box-shadow: 0 0 12px rgba(34,211,238,0.8);
          animation: slideLine 1.5s ease-in-out infinite;
        }
        @keyframes slideLine {
          from { transform: translateX(-100%); }
          to { transform: translateX(350%); }
        }
        .splash-text {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.35em;
          color: rgba(34, 211, 238, 0.7);
          text-transform: uppercase;
          animation: pulseText 2s ease-in-out infinite;
        }
        @keyframes pulseText {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 0.8; }
        }
      </style>
      <div id="initial-splash">
        <div class="splash-content">
          <div class="splash-logo-container">
            <svg width="72" height="72" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="vayna-grad-html" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stopColor="#ffffff" />
                  <stop offset="45%" stopColor="#93c5fd" />
                  <stop offset="100%" stopColor="#3b82f6" />
                </linearGradient>
                <filter id="vayna-glow-html">
                  <feGaussianBlur stdDeviation="1.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <rect width="36" height="36" rx="8" fill="#000000" />
              <text x="18" y="24" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="17" letter-spacing="1" fill="url(#vayna-grad-html)" filter="url(#vayna-glow-html)">VΛ</text>
            </svg>
            <div class="splash-logo-text">
              <div style="position: relative; display: flex; align-items: center;">
                <span class="splash-logo-text-main">
                  V<span style="font-family: 'Georgia', serif;">Λ</span>YN<span style="font-family: 'Georgia', serif;">Λ</span>
                </span>
              </div>
              <div class="splash-logo-text-sub">
                <div style="display: flex; align-items: center; position: relative;">
                  <div style="height: 1px; width: 1.5rem; background: linear-gradient(to right, transparent, #06b6d4);"></div>
                  <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 0.375rem; height: 0.375rem; border-radius: 9999px; background-color: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.8);"></div>
                </div>
                <span>Journal de Trading</span>
                <div style="height: 1px; width: 2rem; background: linear-gradient(to right, rgba(71,85,105,0.6), transparent);"></div>
              </div>
            </div>
          </div>
          <div class="splash-loading-indicator">
            <div class="splash-line">
              <div class="splash-line-inner"></div>
            </div>
            <span class="splash-text">Chargement sécurisé</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
